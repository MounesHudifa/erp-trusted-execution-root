name: Pending rename summary privacy and package metadata
on:
  push:
    branches: [sec02/controller-isolation-validation]
    paths:
      - 'probes/PendingRename-Summary.ps1'
      - 'tests/Test-PendingRenamePrivacy.ps1'
      - '.github/workflows/pending-rename-tests.yml'
permissions:
  contents: read
jobs:
  privacy:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: PowerShell 5.1 output privacy regressions
        shell: powershell
        run: ./tests/Test-PendingRenamePrivacy.ps1
      - name: Read pinned official MSI launch conditions without installation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path=Join-Path $env:RUNNER_TEMP 'public-wsl.msi'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/microsoft/WSL/releases/download/3.0.3/wsl.3.0.3.0.x64.msi' -OutFile $path
          if((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ae977286974255bd26bf925f00f40f5692c6b2084155cbc0563c09aea091f211'){throw 'MSI_HASH_MISMATCH'}
          $signature=Get-AuthenticodeSignature $path
          if($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation'){throw 'MSI_SIGNATURE_INVALID'}
          $installer=New-Object -ComObject WindowsInstaller.Installer
          $db=$installer.OpenDatabase($path,0)
          $view=$db.OpenView('SELECT `Condition`, `Description` FROM `LaunchCondition`')
          $view.Execute()
          $count=0
          while($record=$view.Fetch()){
            $count++
            Write-Output ('PUBLIC_MSI_LAUNCH_CONDITION='+$record.StringData(1))
          }
          $view.Close()
          Write-Output "PUBLIC_MSI_LAUNCH_CONDITION_COUNT=$count"
          Write-Output 'MSI_OPEN_MODE=READ_ONLY; MSI_INSTALLED=NO; TARGET_DEVICE_ACCESSED=NO'
