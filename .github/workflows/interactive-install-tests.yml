name: Interactive install payload safety
on:
  push:
    branches: [sec02/controller-isolation-validation]
    paths:
      - 'probes/Interactive-WslInstall.ps1'
      - 'tests/Test-InteractiveWslInstall.ps1'
      - '.github/workflows/interactive-install-tests.yml'
permissions:
  contents: read
jobs:
  payload:
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - shell: powershell
        run: ./tests/Test-InteractiveWslInstall.ps1
