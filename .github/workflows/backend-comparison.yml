name: Public Backend Comparison - Real Guests

on:
  push:
    branches: [sec02/controller-isolation-validation]
    paths-ignore:
      - 'probes/Interactive-WslInstall.ps1'
      - 'tests/Test-InteractiveWslInstall.ps1'
      - '.github/workflows/interactive-install-tests.yml'
      - 'probes/Wsl2TrialPolicy.ps1'
      - 'probes/Prepare-Wsl2Trial.ps1'
      - 'probes/Get-Wsl2TrialPlan.ps1'
      - 'tests/Test-WslTrialPolicy.ps1'
      - 'tests/Test-WslTrialInstaller.ps1'
      - '.github/workflows/wsl-trial-policy-tests.yml'
      - 'probes/PendingRename-Summary.ps1'
      - 'tests/Test-PendingRenamePrivacy.ps1'
      - '.github/workflows/pending-rename-tests.yml'
      - 'probes/Interactive-ReadOnlyPlan.ps1'
      - 'tests/Test-InteractivePlan.ps1'
      - '.github/workflows/interactive-plan-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu-hardware-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare official public packages on disposable VM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 busybox-static acl strace
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          mkdir -p "$RUNNER_TEMP/public-kernel"
          cd "$RUNNER_TEMP/public-kernel"
          package=$(apt-cache depends linux-image-virtual | awk '/Depends: linux-image-[0-9]/{print $2; exit}')
          test -n "$package"
          apt-get download "$package"
          dpkg-deb --extract ./*.deb image
          kernel=$(find "$RUNNER_TEMP/public-kernel/image/boot" -name 'vmlinuz-*' -type f)
          test -f "$kernel"
          echo "PUBLIC_PROBE_KERNEL=$kernel" >> "$GITHUB_ENV"
          qemu-system-x86_64 --version
          sha256sum ./*.deb "$kernel"
      - name: Real hardware guest acceptance rejection fresh state and timeout
        run: python3 -B probes/qemu_live.py "$PUBLIC_PROBE_KERNEL"
      - name: Read kernel denial evidence without changing confinement
        if: failure()
        run: |
          sudo journalctl -k --since '-10 minutes' --no-pager | grep -E 'apparmor|DENIED|qemu|kvm' | tail -50 || true
  wsl2-confined-guest:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      TRUSTROOT_DISPOSABLE_PUBLIC_VM: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Actual WSL2 capability and confined synthetic execution
        shell: powershell
        run: ./probes/wsl2_public_ci.ps1
      - name: Validate installation preparation syntax and wrong-host denial
        shell: powershell
        run: |
          $errors = $null
          $tokens = $null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'probes/Prepare-Wsl2Trial.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          $denied = $false
          try { ./probes/Prepare-Wsl2Trial.ps1 -ExpectedComputerName 'not-this-public-host' } catch {
            if ($_.Exception.Message -ne 'HOST_IDENTITY_MISMATCH') { throw }
            $denied = $true
          }
          if (-not $denied) { throw 'WRONG_HOST_NOT_REJECTED' }
          ./probes/Prepare-Wsl2Trial.ps1 -Action Plan -ExpectedComputerName $env:COMPUTERNAME
          # Invoke the actual Install entry with Disabled VMP evidence. Verify
          # rejection occurs before any trial directory/receipt or MSI change.
          $trialRoot = Join-Path $env:ProgramData 'TrustedExecution-WslTrial'
          if (Test-Path $trialRoot) { throw 'PUBLIC_TEST_PREIMAGE_NOT_EMPTY' }
          function global:Get-WindowsOptionalFeature { [pscustomobject]@{State='Disabled'} }
          try {
            $refused = $false
            try { ./probes/Prepare-Wsl2Trial.ps1 -Action Install -ExpectedComputerName $env:COMPUTERNAME } catch {
              if ($_.Exception.Message -ne 'VMP_NOT_ALREADY_ENABLED_NO_PARTIAL_CHANGE') { throw }
              $refused = $true
            }
            if (-not $refused -or (Test-Path $trialRoot)) { throw 'VMP_DISABLED_CHANGED_HOST' }
            Write-Output 'VMP_DISABLED_INSTALL_REFUSED_WITHOUT_PARTIAL_CHANGE=PASS'
          } finally { Remove-Item Function:\Get-WindowsOptionalFeature }
