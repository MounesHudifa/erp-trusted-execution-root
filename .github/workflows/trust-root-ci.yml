name: Trust Root Unit and Adversarial Tests

on:
  push:
    branches: [main, sec02/controller-isolation-validation]
    paths-ignore:
      - 'probes/Get-WhpxReadiness.ps1'
      - 'tests/Test-WhpxReadiness.ps1'
      - '.github/workflows/whpx-readiness-tests.yml'
      - 'probes/Interactive-WslInstall.ps1'
      - 'tests/Test-InteractiveWslInstall.ps1'
      - '.github/workflows/interactive-install-tests.yml'
      - 'probes/Wsl2TrialPolicy.ps1'
      - 'probes/Prepare-Wsl2Trial.ps1'
      - 'probes/Get-Wsl2TrialPlan.ps1'
      - 'tests/Test-WslTrialPolicy.ps1'
      - 'tests/Test-WslTrialInstaller.ps1'
      - '.github/workflows/wsl-trial-policy-tests.yml'
      - 'probes/PendingRename-Summary.ps1'
      - 'tests/Test-PendingRenamePrivacy.ps1'
      - '.github/workflows/pending-rename-tests.yml'
      - 'probes/Interactive-ReadOnlyPlan.ps1'
      - 'tests/Test-InteractivePlan.ps1'
      - '.github/workflows/interactive-plan-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-root-tests:
    name: trust-root-tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout public-only test source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare public-only disposable isolation test runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
          bwrap --version
          python3 -I -B scripts/build_probe_runtime.py "/tmp/trustroot-python-runtime-$GITHUB_RUN_ID"
      - name: Run every positive, negative and real OS isolation test without skips
        shell: bash
        env:
          TRUSTROOT_REQUIRE_ISOLATION: '1'
          TRUSTROOT_PROBE_RUNTIME: /tmp/trustroot-python-runtime-${{ github.run_id }}
        run: |
          set -euo pipefail
          # This disposable public VM contains only generic synthetic tests.
          # Keep the sandbox network/user namespace protections intact; use
          # the official runner's existing sudo capability for namespace setup.
          sudo /usr/bin/env TRUSTROOT_REQUIRE_ISOLATION=1 TRUSTROOT_PROBE_RUNTIME="$TRUSTROOT_PROBE_RUNTIME" /usr/bin/python3 -B - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit('PUBLIC_SECURITY_TESTS_FAILED_OR_SKIPPED')
          print('REAL_OS_ISOLATION_TESTS_EXECUTED=YES')
          print('SKIPPED_TESTS=0')
          print('PRIVATE_REPOSITORY_ACCESSED=NO')
          PY
