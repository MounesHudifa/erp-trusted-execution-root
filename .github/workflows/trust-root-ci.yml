name: Trust Root Unit and Adversarial Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-root-tests:
    name: trust-root-tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout public-only test source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run negative and positive security fixtures (isolated GitHub-hosted runner)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -v
